name: Docker Publish (GHCR)

on:
  workflow_dispatch:
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish-ghcr:
    name: Build & Publish Hardened Multi-Arch Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version metadata
        id: meta
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          MAJOR=$(echo "${VERSION}" | cut -d '.' -f 1)
          MINOR=$(echo "${VERSION}" | cut -d '.' -f 2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"
          IMAGE_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_LOWER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local container image for verification
        run: |
          docker build -t unarc:test-verify .
          ./scripts/verify-docker.sh unarc:test-verify

      - name: Build and push multi-arch production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.major_minor }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image }}:latest

      - name: Prune old GHCR image tags (Retain latest 2 versions)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'unarc'
          package-type: 'container'
          min-versions-to-keep: 2
          delete-only-untagged-versions: 'false'
