[package]
name = "unarc"
version = "0.2.1"
edition = "2021"
rust-version = "1.85.0"
description = "Production-grade, security-focused archive utility"
authors = ["Unarc Contributors"]
readme = "README.md"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
rpassword = "7.3"
libc = "0.2"
signal-hook = { version = "0.3", features = ["iterator"] }
sha2 = "0.10"
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }

[build-dependencies]
sha2 = "0.10"

[lib]
name = "unarc"
path = "src/lib.rs"

[[bin]]
name = "unarc"
path = "src/main.rs"

[[bin]]
name = "unarc-sign"
path = "src/bin/unarc-sign.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
