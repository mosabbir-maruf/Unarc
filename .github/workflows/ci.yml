name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Verify (Docker Pinned Toolchain 1.85.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build development Docker image
        run: docker build -t unarc-dev .

      - name: Check code formatting
        run: docker run --rm -v "$PWD:/workspace" -w /workspace unarc-dev cargo fmt --all -- --check

      - name: Run Clippy lints
        run: docker run --rm -v "$PWD:/workspace" -w /workspace unarc-dev cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit and integration tests
        run: docker run --rm -v "$PWD:/workspace" -w /workspace unarc-dev cargo test --all-targets

      - name: Build release binary
        run: docker run --rm -v "$PWD:/workspace" -w /workspace unarc-dev cargo build --release
